<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Billing PDF Reader</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2300855a'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%2300d68f'/%3E%3C/svg%3E" />
  <script src="xlsx.full.min.js"></script>
  <script src="pdf.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',system-ui,sans-serif;background:#f4f9f6;color:#2b3b35;min-height:100vh}
    header{background:#ffffff;color:#1c3a2e;padding:20px 32px;display:flex;align-items:center;gap:14px;border-bottom:1px solid #e3efe9;box-shadow:0 1px 4px rgba(0,0,0,.04)}
    header h1{font-size:1.4rem;font-weight:600;color:#1c3a2e}
    header p{font-size:.85rem;color:#7a9088;margin-top:2px}
    main{max-width:1400px;margin:0 auto;padding:28px 24px}
    #dropzone{border:2px dashed #a9ddc6;border-radius:14px;background:#ffffff;padding:48px 24px;text-align:center;cursor:pointer;transition:border-color .2s,background .2s;margin-bottom:28px}
    #dropzone.drag-over{border-color:#00aa70;background:#eafbf3}
    #dropzone svg{width:48px;height:48px;color:#5fc9a0;margin-bottom:12px}
    #dropzone p.main{font-size:1rem;font-weight:500;color:#1c3a2e}
    #dropzone p.sub{font-size:.83rem;color:#86a298;margin-top:6px}
    #fileInput{display:none}
    .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;border-radius:8px;border:none;font-size:.875rem;font-weight:500;cursor:pointer;transition:opacity .15s,transform .1s}
    .btn:hover{opacity:.88}.btn:active{transform:scale(.97)}
    .btn-primary{background:#00aa70;color:white}
    .btn-green{background:#00855a;color:white}
    .btn-sm{padding:5px 12px;font-size:.8rem}
    #toolbar{display:none;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap}
    .file-badge{background:#e3f8ee;color:#00855a;padding:4px 12px;border-radius:20px;font-size:.83rem;font-weight:500}
    .spacer{flex:1}
    .card{background:white;border-radius:14px;box-shadow:0 1px 4px rgba(0,0,0,.06);overflow:hidden;margin-top:16px;border:1px solid #eaf3ee}
    .card-header{padding:14px 20px;background:#f3fbf7;border-bottom:1px solid #e3efe9;font-weight:600;font-size:.9rem;color:#1c3a2e;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
    #kpis,#monthlyKpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:16px;margin-bottom:0;background:#eafbf3;border:1px solid #cdeede;border-radius:14px;padding:20px}
    .kpi{background:white;border-radius:10px;padding:18px 20px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
    .kpi .label{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:#86a298}
    .kpi .value{font-size:1.4rem;font-weight:700;margin-top:4px}
    .kpi.debt .value{color:#c0392b}.kpi.ok .value{color:#00aa70}.kpi.neutral .value{color:#00855a}.kpi.credit-val .value{color:#00aa70}
    .table-wrap{overflow-x:auto}
    table{width:100%;border-collapse:collapse;font-size:.83rem}
    thead th{background:#00855a;color:white;padding:9px 12px;text-align:left;font-weight:500;white-space:nowrap;position:sticky;top:0}
    thead th.num{text-align:right}
    thead th.sortable{cursor:pointer;-webkit-user-select:none;user-select:none}
    thead th.sortable:hover{background:#00734c}
    .sort-arrow{margin-left:4px;opacity:.4;font-size:.75em}
    .sort-arrow.active{opacity:1}
    tbody tr:nth-child(even){background:#f6fbf8}
    tbody tr:hover{background:#eafbf3}
    tbody td{padding:7px 12px;border-bottom:1px solid #eaf3ee;white-space:nowrap}
    tbody td.num{text-align:right;font-variant-numeric:tabular-nums}
    tfoot td{padding:9px 12px;font-weight:700;background:#eafbf3;color:#00855a;border-top:2px solid #00aa70}
    tfoot td.num{text-align:right}
    .badge-debt{color:#c0392b;font-weight:600}
    .badge-credit{color:#00aa70;font-weight:600;text-decoration:underline}
    .header-icon{width:36px;height:36px;flex-shrink:0}
    .badge-row{background:#e3f8ee;color:#00855a}
    .icon-sm{width:15px;height:15px}
    #accountInfo{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;padding:16px 20px;border-bottom:1px solid #e3efe9}
    #accountInfo:empty{display:none;padding:0;border:0}
    .account-item .label{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:#86a298}
    .account-item .value{font-size:.95rem;font-weight:600;margin-top:3px;color:#1c3a2e;word-break:break-word}
    #status{font-size:.85rem;color:#86a298;margin-top:10px}
    #errors{margin-top:10px}
    .err-row{font-size:.83rem;color:#c0392b;padding:4px 0}
    .card-sub{font-size:.78rem;color:#86a298;font-weight:400;width:100%}
    .filter-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .filter-bar label{font-size:.8rem;color:#5a6f66}
    .filter-select{padding:6px 10px;border-radius:8px;border:1px solid #cdeede;font-size:.83rem;background:white;color:#1c3a2e}
    .year-btn{padding:5px 12px;border-radius:20px;border:1px solid #cdeede;background:white;color:#00855a;font-size:.8rem;font-weight:500;cursor:pointer}
    .year-btn:hover{background:#eafbf3}
    .year-btn.active{background:#00855a;color:white;border-color:#00855a}

  </style>
</head>
<body>
<header>
  <svg viewBox="0 0 32 32" class="header-icon">
    <rect width="32" height="32" rx="8" fill="#00855a"/>
    <circle cx="16" cy="16" r="8" fill="#00d68f"/>
  </svg>
  <div>
    <h1 id="titleText">Billing PDF Reader</h1>
    <p id="subtitleText">Drop one or more "Abrechnung" PDFs to extract consumption, costs, Abschlag and Guthaben/Nachzahlung</p>
  </div>
  <div class="spacer"></div>
  <button type="button" class="btn btn-primary btn-sm" id="langToggle">Deutsch</button>
</header>
<main>
  <div id="dropzone">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/>
      <path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/>
    </svg>
    <p class="main" id="dropMain">Drop billing PDF(s) here, or click to browse</p>
    <p class="sub" id="dropSub">Supports Rabot Energy "Abrechnung im Detail" PDFs - multiple files at once for combined totals</p>
  </div>
  <input type="file" id="fileInput" accept=".pdf" multiple />

  <div id="toolbar">
    <span class="file-badge badge-row" id="rowBadge"></span>
    <div class="spacer"></div>
    <button type="button" class="btn btn-primary btn-sm" id="addMoreBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="icon-sm" style="display:none"></svg>
      Add more PDFs</button>
    <button type="button" class="btn btn-green" id="exportBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="icon-sm">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      <span id="exportBtnLabel">Export to Excel</span>
    </button>
    <button type="button" class="btn btn-primary btn-sm" id="resetBtn">Reset</button>
  </div>

  <div id="status"></div>
  <div id="errors"></div>

  <div class="card" id="resultsCard" style="display:none">
    <div class="card-header"><span id="overviewLabel">Billing Overview</span></div>
    <div id="accountInfo"></div>
    <div style="padding:16px 20px"><div id="kpis"></div></div>
    <div class="table-wrap"><table id="invoiceTable"></table></div>
  </div>

  <div class="card" id="monthlyCard" style="display:none">
    <div class="card-header">
      <span id="monthlyTitleText">Monthly Breakdown</span>
      <div class="filter-bar">
        <div id="yearQuickBtns" class="filter-bar"></div>
        <label id="filterFromLabel" for="filterFrom">From</label>
        <select id="filterFrom" class="filter-select"></select>
        <label id="filterToLabel" for="filterTo">To</label>
        <select id="filterTo" class="filter-select"></select>
        <button type="button" class="btn btn-green btn-sm" id="downloadMonthlyPdfBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="icon-sm">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          <span id="downloadMonthlyPdfBtnLabel">Download PDF</span>
        </button>
      </div>
      <div class="card-sub" id="monthlySubtitleText"></div>
    </div>
    <div style="padding:16px 20px"><div id="monthlyKpis"></div></div>
    <div class="table-wrap"><table id="monthlyTable"></table></div>
  </div>
</main>

<script src="billing-pdf-reader.js"></script>
</body>
</html>
