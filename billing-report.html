<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Billing Report</title>
<style>
  :root{
    --ink:#1e293b;
    --muted:#64748b;
    --accent:#0e7490;
    --border:#e2e8f0;
    --bg-soft:#f8fafc;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:#ffffff;color:var(--ink);padding:40px 44px;max-width:920px;margin:0 auto;line-height:1.45}
  .actions{margin-bottom:26px;text-align:right}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:10px 22px;border-radius:6px;border:1px solid var(--ink);font-size:.85rem;font-weight:600;cursor:pointer;background:var(--ink);color:#fff}
  .btn:hover{opacity:.88}

  .report-header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:24px;flex-wrap:wrap}
  .eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:5px}
  h1{font-size:1.5rem;font-weight:700;color:var(--ink)}
  .generated{font-size:.78rem;color:var(--muted);white-space:nowrap}

  .info-panel{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px 24px;background:var(--bg-soft);border:1px solid var(--border);border-radius:8px;padding:18px 22px;margin-bottom:26px}
  .info-panel:empty{display:none;margin-bottom:0;padding:0;border:0}
  .info-item .label{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:3px}
  .info-item .value{font-size:.92rem;font-weight:600;color:var(--ink);word-break:break-word}

  .kpis{display:flex;gap:14px;margin:0 0 26px;flex-wrap:wrap}
  .kpi{border:1px solid var(--border);background:#fff;border-radius:8px;padding:12px 18px;flex:1;min-width:150px}
  .kpi .label{font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .kpi .value{font-size:1.05rem;font-weight:700;color:var(--ink);margin-top:4px}

  table{width:100%;border-collapse:collapse;font-size:.87rem}
  thead th{background:var(--ink);color:white;padding:9px 12px;text-align:left;font-weight:600}
  thead th.num{text-align:right}
  tbody td{padding:8px 12px;border-bottom:1px solid var(--border)}
  tbody td.num{text-align:right;font-variant-numeric:tabular-nums}
  tbody tr:nth-child(even){background:var(--bg-soft)}
  tfoot td{padding:9px 12px;font-weight:700;border-top:2px solid var(--ink);background:var(--bg-soft)}
  tfoot td.num{text-align:right}
</style>
</head>
<body>
  <div class="actions">
    <button type="button" class="btn" id="printBtn">Download PDF</button>
  </div>
  <div class="report-header">
    <div>
      <div class="eyebrow" id="reportEyebrow">Report</div>
      <h1 id="reportTitle"></h1>
    </div>
    <div class="generated" id="reportGenerated"></div>
  </div>
  <div class="info-panel" id="reportInfo"></div>
  <div class="kpis" id="reportKpis"></div>
  <table>
    <thead id="reportThead"></thead>
    <tbody id="reportTbody"></tbody>
    <tfoot id="reportTfoot"></tfoot>
  </table>
  <script src="jspdf.umd.min.js"></script>
  <script src="jspdf.plugin.autotable.min.js"></script>
  <!-- Bump ?v= whenever billing-report.js changes - see the note in index.html. -->
<script src="billing-report.js?v=3"></script>
</body>
</html>
